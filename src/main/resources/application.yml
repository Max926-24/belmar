spring:
  application:
    name: belmar

  # Секреты (JWT-ключ) лежат в secret.properties в корне проекта (файл в .gitignore)
  config:
    import: optional:file:./secret.properties

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/belmar
    username: postgres
    password: postgres

  # Liquibase: схема БД создаётся миграциями из db/changelog
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      # validate: таблицы создаёт Liquibase, Hibernate только сверяет сущности с таблицами
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: info

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 60
