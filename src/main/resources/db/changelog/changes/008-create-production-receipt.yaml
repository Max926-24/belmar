databaseChangeLog:
  - changeSet:
      id: 008-create-production-receipt
      author: maxim
      changes:
        - createTable:
            tableName: production_receipt
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: doc_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_receipt_created_by
                    references: account(id)
        - createTable:
            tableName: production_receipt_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: receipt_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_receipt_item_receipt
                    references: production_receipt(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_receipt_item_product
                    references: product(id)
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false